<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راهنمای جامع گزارش‌نویسی CTF - با مثال‌های واقعی</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --border: #e1e4e8;
            --text: #1a1a2e;
            --text-secondary: #5a5a7a;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --linux: #e67e22;
            --linux-light: #fff8f3;
            --windows: #3498db;
            --windows-light: #f0f8ff;
            --web: #8e44ad;
            --web-light: #faf5ff;
            --network: #1abc9c;
            --network-light: #f0fffb;
            --forensics: #e74c3c;
            --forensics-light: #fff5f5;
            --incident: #e91e63;
            --incident-light: #fff5f8;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
            --code-bg: #f0f2f5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --surface: #161b22;
                --border: #30363d;
                --text: #c9d1d9;
                --text-secondary: #8b949e;
                --accent: #58a6ff;
                --accent-light: #0d1117;
                --code-bg: #1c2128;
                --shadow: 0 2px 8px rgba(0,0,0,0.3);
                --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);
                --linux-light: #1a1410;
                --windows-light: #101820;
                --web-light: #18101e;
                --network-light: #101e1a;
                --forensics-light: #1a1010;
                --incident-light: #1a1016;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Vazirmatn', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            min-height: 100vh;
        }

        .container { max-width: 960px; margin: 0 auto; padding: 16px; }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 16px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .header .icon { font-size: 3rem; display: block; margin-bottom: 8px; }
        .header h1 { font-size: 1.8rem; font-weight: 800; }
        .header p { color: var(--text-secondary); font-size: 0.95rem; }

        /* Category Tabs */
        .tabs-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
            justify-content: center;
        }
        .tab-btn {
            padding: 10px 16px;
            border: 2px solid var(--border);
            border-radius: 30px;
            background: var(--surface);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.25s ease;
            white-space: nowrap;
            color: var(--text);
            font-family: inherit;
        }
        .tab-btn:hover { border-color: var(--accent); background: var(--accent-light); }
        .tab-btn.active { border-color: var(--accent); background: var(--accent-light); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .tab-btn.linux.active { border-color: var(--linux); box-shadow: 0 0 0 3px rgba(230,126,34,0.15); }
        .tab-btn.windows.active { border-color: var(--windows); box-shadow: 0 0 0 3px rgba(52,152,219,0.15); }
        .tab-btn.web.active { border-color: var(--web); box-shadow: 0 0 0 3px rgba(142,68,173,0.15); }
        .tab-btn.network.active { border-color: var(--network); box-shadow: 0 0 0 3px rgba(26,188,156,0.15); }
        .tab-btn.forensics.active { border-color: var(--forensics); box-shadow: 0 0 0 3px rgba(231,76,60,0.15); }
        .tab-btn.incident.active { border-color: var(--incident); box-shadow: 0 0 0 3px rgba(233,30,99,0.15); }

        /* Main Card */
        .main-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .card-header .title { font-size: 1.3rem; font-weight: 700; }
        .card-header .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
        }
        .badge-linux { background: var(--linux); }
        .badge-windows { background: var(--windows); }
        .badge-web { background: var(--web); }
        .badge-network { background: var(--network); }
        .badge-forensics { background: var(--forensics); }
        .badge-incident { background: var(--incident); }

        .card-body { padding: 20px 24px; }

        /* Section Block */
        .section-block {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .section-header {
            padding: 14px 18px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .section-header:hover { background: var(--accent-light); }
        .section-num {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.9rem;
            flex-shrink: 0;
        }
        .section-title-text { font-weight: 700; font-size: 1rem; flex: 1; }
        .section-arrow { transition: transform 0.3s; font-size: 1.2rem; color: var(--text-secondary); }
        .section-block.open .section-arrow { transform: rotate(180deg); }

        .section-content {
            padding: 0 18px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease;
        }
        .section-block.open .section-content {
            max-height: 2000px;
            padding: 16px 18px;
        }

        /* Hint & Example */
        .hint-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }
        .hint-label {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }
        .hint-text { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.7; }
        .hint-text ul { list-style: none; padding: 0; margin: 4px 0 0; }
        .hint-text ul li { padding: 3px 0; padding-right: 16px; position: relative; }
        .hint-text ul li::before { content: '•'; position: absolute; right: 0; color: var(--accent); font-weight: 700; }

        .example-box {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-top: 8px;
            font-family: 'Consolas', 'Courier New', 'Vazirmatn', monospace;
            font-size: 0.85rem;
            line-height: 1.9;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
            position: relative;
        }
        .example-box::before {
            content: '📝 مثال عملی';
            display: block;
            font-family: 'Segoe UI', 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border);
        }
        .example-box .cmd { color: #e67e22; }
        .example-box .output { color: #8b949e; }
        .example-box .flag { color: #1abc9c; font-weight: 700; }
        .example-box .important { color: #e74c3c; font-weight: 700; }

        /* Flow Arrow */
        .flow-arrow {
            text-align: center;
            padding: 4px 0;
            font-size: 1.3rem;
            color: var(--accent);
            opacity: 0.4;
            font-weight: 700;
        }

        /* Tips */
        .tips-card {
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-top: 20px;
        }
        .tips-title { font-weight: 700; font-size: 1rem; margin-bottom: 10px; }
        .tips-card ul { list-style: none; padding: 0; }
        .tips-card ul li {
            padding: 6px 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding-right: 22px;
            position: relative;
        }
        .tips-card ul li::before {
            content: '💡';
            position: absolute;
            right: 0;
            font-size: 0.8rem;
        }

        /* Print */
        @media print {
            body { background: #fff; color: #000; font-size: 12px; }
            .tabs-wrapper { display: none; }
            .section-content { max-height: none !important; padding: 10px 14px !important; }
            .section-arrow { display: none; }
            .card-header { padding: 10px 14px; }
            .card-body { padding: 10px 14px; }
            .example-box { font-size: 11px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>

                        </div>
                        <div class="example-box">${sec.example}</div>
                    </div>
                </div>`;
