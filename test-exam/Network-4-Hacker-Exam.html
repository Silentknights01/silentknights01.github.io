<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شبکه برای هکرها — تمرین‌های عملی</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ace.js"></script>
    <style>
        :root {
            --bg: #050510;
            --terminal: #0a0f1a;
            --panel: #0d1321;
            --border: #1a2235;
            --red: #ff2a2a;
            --red-soft: rgba(255,42,42,0.1);
            --green: #00ff41;
            --green-soft: rgba(0,255,65,0.1);
            --cyan: #00d9ff;
            --dim: #7a8ba8;
            --light: #e0e6f0;
            --gold: #ffd700;
            --blue: #4a9eff;
            --blue-soft: rgba(74,158,255,0.1);
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { scroll-behavior:smooth; }
        body {
            background:var(--bg); color:var(--light);
            font-family:'Vazirmatn',sans-serif; line-height:1.7;
            padding:20px; min-height:100vh;
            background-image:linear-gradient(rgba(255,42,42,0.025) 1px,transparent 1px),
                linear-gradient(90deg,rgba(255,42,42,0.025) 1px,transparent 1px),
                radial-gradient(ellipse at 20% 0%,rgba(255,42,42,0.08) 0%,transparent 50%),
                radial-gradient(ellipse at 80% 100%,rgba(0,217,255,0.06) 0%,transparent 50%),
                linear-gradient(135deg,#020812 0%,#150505 100%);
            background-size:40px 40px,40px 40px,100% 100%,100% 100%,100% 100%;
            background-attachment:fixed; position:relative;
        }
        body::before {
            content:''; position:fixed; inset:0;
            background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,0.08) 3px,transparent 4px);
            pointer-events:none; z-index:1; animation:scan 8s linear infinite;
        }
        @keyframes scan { 100% { background-position:0 100px; } }
        .container { max-width:1280px; margin:0 auto; position:relative; z-index:2; }

        .banner-wrap {
            position:relative; border-radius:12px; overflow:hidden;
            border:1px solid var(--border); box-shadow:0 20px 60px rgba(255,42,42,0.2);
            margin-bottom:30px; height:280px;
            background: linear-gradient(135deg, #0a0a2e 0%, #1a0a0a 50%, #0a0a2e 100%);
            display:flex; align-items:center; justify-content:center;
        }
        .banner-wrap .banner-bg {
            position:absolute; inset:0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255,42,42,0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(0,217,255,0.1) 0%, transparent 60%),
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 41px);
            z-index:0;
        }
        .banner-wrap .banner-content {
            position:relative; z-index:1;
            display:flex; flex-direction:column; align-items:center;
            text-align:center; padding:20px;
        }
        .banner-wrap .banner-title {
            font-family:'Fira Code',monospace;
            font-size:3.2rem; font-weight:900;
            background:linear-gradient(90deg, #ff2a2a, #ff6b6b, #ffd700, #00ff41, #00d9ff);
            background-size:300% 100%;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
            animation:gradientMove 4s ease-in-out infinite;
            text-shadow:0 0 40px rgba(255,42,42,0.3);
            letter-spacing:4px;
            line-height:1.2;
        }
        @keyframes gradientMove {
            0%,100% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
        }
        .banner-wrap .banner-sub {
            font-family:'Fira Code',monospace;
            font-size:1.1rem; color:var(--dim);
            margin-top:8px; letter-spacing:6px;
            direction:ltr;
        }
        .banner-wrap .banner-sub span { color:var(--red); }
        .banner-wrap .banner-tags {
            display:flex; gap:15px; margin-top:15px;
            flex-wrap:wrap; justify-content:center;
        }
        .banner-wrap .banner-tag {
            font-family:'Fira Code',monospace;
            font-size:0.7rem; color:var(--light);
            border:1px solid rgba(255,255,255,0.1);
            padding:4px 14px; border-radius:20px;
            background:rgba(255,255,255,0.03);
            letter-spacing:1px;
            backdrop-filter:blur(4px);
        }
        .banner-wrap .banner-tag i { margin-left:6px; }
        .banner-wrap .banner-tag.red { border-color:rgba(255,42,42,0.3); color:var(--red); }
        .banner-wrap .banner-tag.green { border-color:rgba(0,255,65,0.3); color:var(--green); }
        .banner-wrap .banner-tag.gold { border-color:rgba(255,215,0,0.3); color:var(--gold); }
        .banner-wrap .banner-tag.blue { border-color:rgba(74,158,255,0.3); color:var(--blue); }

        .banner-overlay {
            position:absolute; bottom:20px; right:30px; z-index:3;
            font-family:'Fira Code',monospace; color:var(--red); font-size:0.75rem;
            text-shadow:0 0 10px rgba(255,42,42,0.8); direction:ltr;
            opacity:0.6;
        }
        .banner-overlay span { color:var(--green); }

        .progress-bar-wrap {
            background:var(--terminal); border:1px solid var(--border); border-radius:8px;
            padding:15px 20px; margin-bottom:25px;
            display:flex; align-items:center; gap:20px;
        }
        .progress-label {
            font-family:'Fira Code',monospace; font-size:0.85rem; color:var(--dim);
            direction:ltr; white-space:nowrap;
        }
        .progress-track { flex:1; height:10px; background:#020408; border-radius:5px; overflow:hidden; border:1px solid var(--border); }
        .progress-fill {
            height:100%; background:linear-gradient(90deg,var(--red) 0%,var(--gold) 50%,var(--green) 100%);
            width:0%; transition:width 0.6s ease; box-shadow:0 0 15px rgba(0,255,65,0.5);
        }
        .progress-count {
            font-family:'Fira Code',monospace; font-weight:700; color:var(--green);
            font-size:1.1rem; direction:ltr; min-width:60px; text-align:center;
        }

        .auth-panel {
            background:var(--terminal); border:1px solid var(--red);
            padding:18px 22px; border-radius:8px; margin-bottom:30px;
            display:flex; gap:12px; align-items:center; flex-wrap:wrap;
            box-shadow:0 0 30px rgba(255,42,42,0.15), inset 0 0 30px rgba(255,42,42,0.03);
            position:relative; overflow:hidden;
        }
        .auth-panel::before {
            content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
            background:linear-gradient(90deg,transparent,rgba(255,42,42,0.05),transparent);
            animation:sweep 4s infinite;
        }
        @keyframes sweep { 100% { left:100%; } }
        .auth-panel .icon-box {
            width:42px; height:42px; background:var(--red-soft); border:1px solid var(--red);
            border-radius:6px; display:flex; align-items:center; justify-content:center;
            color:var(--red); font-size:18px; flex-shrink:0;
        }
        .auth-panel input {
            background:#020408; border:1px solid var(--border); color:var(--light);
            padding:11px 15px; border-radius:5px; font-family:'Fira Code',monospace;
            flex:1; min-width:180px; transition:0.3s; direction:ltr;
        }
        .auth-panel input:focus { outline:none; border-color:var(--red); box-shadow:0 0 12px rgba(255,42,42,0.3); }
        .auth-panel input::placeholder { color:var(--dim); }
        .auth-panel button {
            background:var(--red); color:#fff; border:none; padding:11px 24px;
            border-radius:5px; font-weight:700; cursor:pointer;
            font-family:'Vazirmatn',sans-serif; transition:0.3s;
            box-shadow:0 4px 15px rgba(255,42,42,0.3);
        }
        .auth-panel button:hover { background:#ff4040; transform:translateY(-1px); box-shadow:0 6px 20px rgba(255,42,42,0.5); }

        header {
            text-align:center; margin-bottom:40px; padding-bottom:25px;
            border-bottom:1px solid var(--border); position:relative;
        }
        header h1 {
            font-family:'Fira Code',monospace; color:var(--red); font-size:2.8rem;
            font-weight:700; text-shadow:0 0 30px rgba(255,42,42,0.6),0 0 60px rgba(255,42,42,0.3);
            margin-bottom:12px; direction:ltr; letter-spacing:2px;
        }
        header h1 .cursor {
            display:inline-block; width:12px; height:32px; background:var(--red);
            margin-left:4px; vertical-align:middle; animation:blink 1s infinite;
        }
        @keyframes blink { 50% { opacity:0; } }
        header p { color:var(--dim); font-size:1.05rem; }
        header .status-tag {
            display:inline-block; font-family:'Fira Code',monospace; font-size:0.75rem;
            color:var(--green); border:1px solid var(--green); padding:2px 10px;
            border-radius:3px; margin-top:10px; direction:ltr;
        }

        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(480px,1fr)); gap:25px; }

        .terminal-card {
            background:var(--terminal); border:1px solid var(--border); border-radius:10px;
            overflow:hidden; transition:all 0.35s ease; display:flex; flex-direction:column;
            position:relative;
        }
        .terminal-card:hover { border-color:rgba(255,42,42,0.5); box-shadow:0 10px 40px rgba(255,42,42,0.15); transform:translateY(-4px); }
        .terminal-card.completed { border-color:var(--green); }
        .terminal-card.completed::after {
            content:'\f058'; font-family:'Font Awesome 6 Free'; font-weight:900;
            position:absolute; top:14px; left:14px; color:var(--green); font-size:22px;
            z-index:10; text-shadow:0 0 12px rgba(0,255,65,0.6);
        }
        .terminal-card.rejected { border-color:var(--red); }
        .terminal-card.pending { border-color:var(--gold); }

        .card-header {
            background:var(--panel); padding:10px 16px; display:flex;
            align-items:center; justify-content:space-between; border-bottom:1px solid var(--border);
        }
        .dots { display:flex; gap:6px; }
        .dot { width:11px; height:11px; border-radius:50%; }
        .dot.red { background:#ff5f56; }
        .dot.yellow { background:#ffbd2e; }
        .dot.green { background:#27c93f; }
        .card-title {
            font-family:'Fira Code',monospace; color:var(--light); font-size:0.82rem;
            direction:ltr; display:flex; align-items:center; gap:8px;
        }
        .card-title .badge {
            background:var(--red-soft); color:var(--red); padding:1px 7px;
            border-radius:3px; font-size:0.7rem; border:1px solid rgba(255,42,42,0.3);
        }
        .card-title .badge.theory { color:var(--cyan); border-color:rgba(0,217,255,0.4); background:rgba(0,217,255,0.1); }
        .card-title .badge.technical { color:var(--gold); border-color:rgba(255,215,0,0.4); background:rgba(255,215,0,0.1); }
        .card-title .badge.practical { color:var(--green); border-color:rgba(0,255,65,0.4); background:rgba(0,255,65,0.1); }

        .card-body { padding:20px; flex-grow:1; display:flex; flex-direction:column; }
        .task-desc {
            margin-bottom:14px; color:var(--dim); font-size:0.95rem; line-height:1.8;
        }
        .task-desc strong { color:var(--red); font-weight:700; }

        .help-btn {
            background:transparent; border:1px solid var(--blue); color:var(--blue);
            padding:6px 16px; border-radius:5px; cursor:pointer;
            font-family:'Vazirmatn',sans-serif; font-size:0.85rem; transition:0.3s;
            display:inline-flex; align-items:center; gap:6px; margin:8px 0 4px 0; width:fit-content;
        }
        .help-btn:hover { background:var(--blue-soft); box-shadow:0 0 20px rgba(74,158,255,0.2); }

        .help-box {
            background:rgba(74,158,255,0.05); border:1px solid var(--blue);
            border-radius:6px; padding:12px 16px; margin:6px 0 10px 0;
            display:none; font-size:0.9rem; color:#b0ccee; line-height:1.8;
        }
        .help-box.show { display:block; }
        .help-box strong { color:var(--blue); }

        .expected-output-label {
            color:var(--dim); font-size:0.75rem; margin-bottom:6px; margin-top:8px;
            font-family:'Fira Code',monospace; direction:ltr; display:flex; align-items:center; gap:6px;
        }
        .expected-output-label i { color:var(--green); }

        .vs-code-container {
            margin-top:16px; border-radius:6px; overflow:hidden;
            border:1px solid #2a2a2a; display:flex; flex-direction:column;
            height:200px; background:#1e1e1e;
        }
        .vs-code-tab {
            background:#252526; padding:7px 14px; font-family:'Fira Code',monospace;
            font-size:0.78rem; color:#cccccc; border-bottom:1px solid #1e1e1e;
            display:flex; align-items:center; gap:8px; height:34px; flex-shrink:0;
        }
        .vs-code-tab i { color:#4584b6; }
        .vs-code-tab .dot-mod {
            width:6px; height:6px; background:var(--green); border-radius:50%;
            margin-right:auto; opacity:0; transition:0.3s;
        }
        .vs-code-tab .dot-mod.show { opacity:1; }
        .ace-editor { flex-grow:1; width:100%; direction:ltr; }

        .submit-btn {
            width:100%; margin-top:14px; padding:12px;
            background:transparent; border:1px dashed var(--dim); color:var(--dim);
            border-radius:5px; cursor:pointer; transition:0.3s;
            font-family:'Vazirmatn',sans-serif; font-size:0.95rem; font-weight:700;
            display:flex; align-items:center; justify-content:center; gap:8px;
        }
        .submit-btn:hover:not(:disabled) { border-color:var(--red); border-style:solid; color:var(--red); background:var(--red-soft); box-shadow:0 0 15px rgba(255,42,42,0.2); }
        .submit-btn:disabled { border-style:solid; cursor:default; opacity:0.7; }
        .submit-btn.approved { border-color:var(--green) !important; color:var(--green) !important; }
        .submit-btn.rejected { border-color:var(--red) !important; color:var(--red) !important; }
        .submit-btn.pending { border-color:var(--gold) !important; color:var(--gold) !important; }

        .feedback-msg {
            margin-top:8px; font-size:0.85rem; color:var(--red);
            background:var(--red-soft); border-radius:4px; padding:6px 12px;
            border-right:3px solid var(--red); display:none; direction:rtl;
        }
        .feedback-msg.show { display:block; }

        .toast {
            position:fixed; bottom:25px; left:25px; padding:14px 24px;
            border-radius:6px; font-weight:700; opacity:0; transform:translateY(20px);
            transition:all 0.3s; pointer-events:none; z-index:9999;
            display:flex; align-items:center; gap:10px; font-family:'Vazirmatn',sans-serif;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.success { background:var(--green); color:#000; }
        .toast.error { background:var(--red); color:#fff; }
        .toast.show { opacity:1; transform:translateY(0); }

        .locked-overlay {
            position:absolute; inset:0; background:rgba(5,5,16,0.85);
            backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center;
            flex-direction:column; gap:10px; z-index:5; border-radius:10px; transition:0.4s;
        }
        .locked-overlay i { font-size:32px; color:var(--dim); }
        .locked-overlay span { font-family:'Fira Code',monospace; color:var(--dim); font-size:0.85rem; direction:ltr; }
        .terminal-card.unlocked .locked-overlay { display:none; }

        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.7);
            backdrop-filter:blur(5px); z-index:9998; display:none;
            align-items:center; justify-content:center; padding:30px;
        }
        .modal-overlay.show { display:flex; }
        .modal-box {
            background:var(--terminal); border:1px solid var(--blue); border-radius:12px;
            max-width:700px; width:100%; max-height:80vh; overflow-y:auto;
            padding:30px; box-shadow:0 20px 60px rgba(0,0,0,0.8); position:relative;
        }
        .modal-box .close-modal {
            position:absolute; top:15px; left:20px;
            background:transparent; border:none; color:var(--dim);
            font-size:1.5rem; cursor:pointer; transition:0.3s;
        }
        .modal-box .close-modal:hover { color:var(--red); }
        .modal-box h3 { color:var(--blue); font-family:'Fira Code',monospace; margin-bottom:15px; font-size:1.3rem; }
        .modal-box p { color:var(--light); line-height:1.9; font-size:0.95rem; }
        .modal-box .highlight-text { color:var(--gold); font-weight:700; }

        @media (max-width:768px) {
            .grid { grid-template-columns:1fr; }
            header h1 { font-size:1.8rem; }
            .banner-wrap { height:220px; }
            .banner-wrap .banner-title { font-size:2rem; }
            .banner-wrap .banner-sub { font-size:0.8rem; }
            .banner-wrap .banner-tag { font-size:0.6rem; padding:2px 10px; }
            .vs-code-container { height:180px; }
            .auth-panel input { min-width:100%; }
            body { padding:12px; }
            .modal-box { padding:20px; margin:10px; }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="modal-overlay" id="helpModal">
        <div class="modal-box">
            <button class="close-modal" onclick="closeHelpModal()"><i class="fas fa-times"></i></button>
            <h3 id="modalTitle">📖 راهنمای سوال</h3>
            <div id="modalBody"><p>...</p></div>
        </div>
    </div>

    <div class="container">

        <div class="banner-wrap">
            <div class="banner-bg"></div>
            <div class="banner-content">
                <div class="banner-title">NETWORK BASICS FOR HACKERS</div>
                <div class="banner-sub"><span>◈</span> OSI MODEL <span>◈</span> TCP/IP <span>◈</span> SUBNETTING <span>◈</span> PROTOCOLS <span>◈</span></div>
                <div class="banner-tags">
                    <span class="banner-tag red"><i class="fas fa-shield-halved"></i> ETHICAL HACKING</span>
                    <span class="banner-tag gold"><i class="fas fa-network-wired"></i> NETWORK SECURITY</span>
                    <span class="banner-tag green"><i class="fas fa-terminal"></i> LINUX BASICS</span>
                    <span class="banner-tag blue"><i class="fas fa-wifi"></i> WIRELESS</span>
                </div>
            </div>
            <div class="banner-overlay">
                > network.lab.init() <span>OK</span><br />
                > version: 2.0
            </div>
        </div>

        <div class="auth-panel">
            <div class="icon-box"><i class="fas fa-user-secret"></i></div>
            <input type="text" id="studentName" placeholder="نام و نام خانوادگی" required />
            <input type="text" id="studentAlias" placeholder="تخلص هکری" required />
            <button onclick="loginStudent()"><i class="fas fa-terminal"></i> ورود</button>
            <button onclick="testConnection()" style="background:#555; box-shadow:none;"><i class="fas fa-plug"></i> تست</button>
        </div>

        <div class="progress-bar-wrap">
            <div class="progress-label">پیشرفت</div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-count" id="progressCount">0 / 20</div>
        </div>

        <header>
            <h1>&gt; شبکه برای هکرها_<span class="cursor"></span></h1>
            <p id="welcomeMsg">برای شروع، نام و تخلص هکری خود را وارد کنید</p>
            <div class="status-tag">// ۲۰ تمرین · شبکه · همه سطوح</div>
        </header>

        <div class="grid" id="challengeGrid"></div>
    </div>

    <script>
        // ===== ۲۰ سوال بر اساس کتاب (با توجه به فصل‌های مشخص شده) =====
        const CHALLENGES = [
            // ===== ۱-۷: تشریحی (نظری) - فصل ۱ =====
            {
                id:'001', type:'theory',
                title:'آدرس آی‌پی چیست؟ (فصل ۱)',
                desc:'<strong>آدرس آی‌پی</strong> چیست و از چند بخش ساخته شده است؟ چرا هر دستگاه به یک آی‌پی منحصر‌بفرد نیاز دارد؟',
                hint:'📘 فصل ۱ — آی‌پی از ۴ بخش ۸ بیتی تشکیل شده.',
                help:'💡 آی‌پی یک شناسه عددی برای دستگاه در شبکه است. به ساختار بخش‌ها و عدد ۲۵۵ فکر کنید.'
            },
            {
                id:'002', type:'theory',
                title:'TCP Three-Way Handshake (فصل ۱)',
                desc:'<strong>Three-Way Handshake</strong> در TCP چگونه انجام می‌شود؟ هدف آن چیست؟',
                hint:'📘 فصل ۱ — سه مرحله: SYN, SYN-ACK, ACK',
                help:'💡 به مراحل برقراری ارتباط و تأییدیه‌ها فکر کنید.'
            },
            {
                id:'003', type:'theory',
                title:'تفاوت TCP و UDP (فصل ۱)',
                desc:'<strong>TCP</strong> با <strong>UDP</strong> چه فرقی دارد؟ کدام برای انتقال فایل بهتر است؟',
                hint:'📘 فصل ۱ — یکی باثبات است، دیگری سریع.',
                help:'💡 به تفاوت در قابلیت اطمینان و سرعت فکر کنید.'
            },
            {
                id:'004', type:'theory',
                title:'پورت چیست؟ (فصل ۱)',
                desc:'<strong>پورت</strong> چیست؟ چند پورت معروف و سرویس‌های آنها را نام ببرید.',
                hint:'📘 فصل ۱ — پورت مثل شماره آپارتمان است.',

            {

                help:'💡 از گزینه -s برای آی‌پی و -j DROP برای بلاک استفاده کنید. INPUT برای ورودی، OUTPUT برای خروجی.'

                hint:'📘 فصل ۵ — aircrack-ng, airodump-ng, aireplay-ng',
                help:'💡 به مراحل: مانیتور مود، کپچر هندشیک، داث، و کرک با هش‌کت فکر کنید.'
            },
            {

                title:'انواع فریم‌های وای‌فای (فصل ۵)',
                desc:'انواع <strong>فریم‌های 802.11</strong> را نام ببرید و توضیح دهید هرکدام چه کاربردی دارند.',
                hint:'📘 فصل ۵ — Management, Control, Data',
                help:'💡 Management: مدیریت ارتباط، Control: کنترل جریان، Data: انتقال داده'
            },

            // ===== ۱۱-۲۰: عملی =====
            {
                id:'011', type:'practical',
                title:'مشاهده آی‌پی با ifconfig (فصل ۱ و ۳)',
                desc:'با خط فرمان لینوکس، <strong>آی‌پی</strong> کارت شبکه خود را پیدا کنید.',
                hint:'📘 فصل ۱ و ۳ — ip addr یا ifconfig',
                help:'💡 از دستور ip addr یا ifconfig استفاده کنید.'
            },
            {
                id:'012', type:'practical',
                title:'ارسال پینگ (فصل ۳)',
                desc:'به آدرس 8.8.8.8 <strong>۴ بسته</strong> پینگ ارسال کنید.',
                hint:'📘 فصل ۳ — ping -c 4',
                help:'💡 از ping با گزینه -c برای تعیین تعداد بسته استفاده کنید.'
            },
            {

                title:'دیدن پورت‌های باز (فصل ۳)',

                help:'💡 از netstat یا ss با گزینه‌های مناسب استفاده کنید.'
            },
            {
                id:'014', type:'practical',
                title:'اسکن با nmap (فصل ۱ و ۷)',
                desc:'با <strong>nmap</strong>، پورت‌های باز روی 127.0.0.1 را اسکن کنید.',

                help:'💡 از nmap بدون گزینه خاص برای اسکن پیش‌فرض استفاده کنید.'
            },
            {
                id:'015', type:'practical',
                title:'اسکن شبکه محلی (فصل ۷)',

                help:'💡 از گزینه -sn برای اسکن پینگ (فقط پیدا کردن دستگاه‌های زنده) استفاده کنید.'
            },
            {
                id:'016', type:'practical',
                title:'کپچر ترافیک با tcpdump (فصل ۳)',

                hint:'📘 فصل ۳ — tcpdump -i eth0 port 80 -w',
                help:'💡 از گزینه -i برای تعیین رابط، port برای فیلتر، و -w برای ذخیره استفاده کنید.'
            },
            {
                id:'017', type:'practical',
                title:'فیلتر در Wireshark (فصل ۳)',
                desc:'در <strong>Wireshark</strong>، فیلتری بنویسید که فقط ترافیک HTTP را نشان دهد.',
                hint:'📘 فصل ۳ — فیلتر http',
                help:'💡 عبارت http را در قسمت فیلتر نمایش وارد کنید.'
            },
            {
                id:'018', type:'practical',
                title:'استعلام DNS با dig (فصل ۸)',
                desc:'با <strong>dig</strong>، آی‌پی دامنه hackers-arise.com را پیدا کنید و نوع رکورد NS را نیز ببینید.',
                hint:'📘 فصل ۸ — dig hackers-arise.com و dig hackers-arise.com ns',
                help:'💡 dig برای جستجوی DNS است. با dig hackers-arise.com آی‌پی و با dig hackers-arise.com ns سرورهای نام را می‌بینید.'
            },
            {
                id:'019', type:'practical',
                title:'مشاهده جدول ARP (فصل ۷)',
                desc:'جدول <strong>ARP</strong> سیستم را ببینید و آی‌پی دروازه را پیدا کنید.',
                hint:'📘 فصل ۷ — arp -n',
                help:'💡 از arp -n برای دیدن جدول ARP بدون تبدیل نام استفاده کنید.'
            },
            {
                id:'020', type:'practical',
                title:'مشاهده نسخه کرنل (فصل ۱۵)',
                desc:'نسخه <strong>کرنل</strong> لینوکس خود را با خط فرمان ببینید.',
                hint:'📘 فصل ۱۵ — uname -a',
                help:'💡 از uname با گزینه -a برای نمایش تمام اطلاعات سیستم استفاده کنید.'
            }
        ];

        const WORKER_URL = 'https://python-for-hackers.silentknights0101.workers.dev';
        let studentData = JSON.parse(localStorage.getItem('hackerStudent')) || null;
        let completedChallenges = JSON.parse(localStorage.getItem('completedChallenges')) || [];
        const editors = {};

        function buildCards() {
            const grid = document.getElementById('challengeGrid');
            grid.innerHTML = '';
            CHALLENGES.forEach(ch => {
                const id = ch.id;
                const typeMap = { theory:'نظری', technical:'تکنیکی', practical:'عملی' };
                const badgeClass = ch.type;
                const card = document.createElement('div');
                card.className = 'terminal-card locked';
                card.dataset.challenge = id;

                const overlay = document.createElement('div');
                overlay.className = 'locked-overlay';
                overlay.innerHTML = `<i class="fas fa-lock"></i><span>// نیاز به احراز هویت</span>`;
                card.appendChild(overlay);

                const header = document.createElement('div');
                header.className = 'card-header';
                header.innerHTML = `
                    <div class="dots"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
                    <div class="card-title"><span class="badge ${badgeClass}">${id}</span> ${typeMap[ch.type]}: ${ch.title}</div>
                `;
                card.appendChild(header);

                const body = document.createElement('div');
                body.className = 'card-body';

                const desc = document.createElement('div');
                desc.className = 'task-desc';
                desc.innerHTML = ch.desc;
                body.appendChild(desc);

                const helpBtn = document.createElement('button');
                helpBtn.className = 'help-btn';
                helpBtn.innerHTML = '<i class="fas fa-question-circle"></i> 🤔 راهنما';
                helpBtn.onclick = () => showHelpModal(ch.id);
                body.appendChild(helpBtn);

                const helpBox = document.createElement('div');
                helpBox.className = 'help-box';
                helpBox.id = `helpbox-${ch.id}`;
                helpBox.innerHTML = `<strong>📘 اشاره:</strong> ${ch.hint}`;
                body.appendChild(helpBox);

                const label = document.createElement('div');
                label.className = 'expected-output-label';
                label.innerHTML = '<i class="fas fa-chevron-right"></i> پاسخ خود را بنویسید:';
                body.appendChild(label);

                const editorContainer = document.createElement('div');
                editorContainer.className = 'vs-code-container';
                const tab = document.createElement('div');
                tab.className = 'vs-code-tab';
                tab.innerHTML = `<i class="fas fa-terminal"></i> answer_${id}.txt <div class="dot-mod"></div>`;
                editorContainer.appendChild(tab);
                const editorDiv = document.createElement('div');
                editorDiv.className = 'ace-editor';
                editorDiv.id = `editor-${id}`;
                editorContainer.appendChild(editorDiv);
                body.appendChild(editorContainer);

                const feedback = document.createElement('div');
                feedback.className = 'feedback-msg';
                feedback.id = `feedback-${id}`;
                body.appendChild(feedback);

                const btn = document.createElement('button');
                btn.className = 'submit-btn';
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> ارسال پاسخ';
                btn.onclick = () => submitChallenge(btn, id);
                btn.disabled = true;
                body.appendChild(btn);

                card.appendChild(body);
                grid.appendChild(card);
            });
            initEditors();
        }

        function initEditors() {
            document.querySelectorAll('.ace-editor').forEach(el => {
                const id = el.id.replace('editor-', '');
                const editor = ace.edit(el, {
                    theme:"ace/theme/monokai", mode:"ace/mode/text",
                    autoScrollEditorIntoView:true, showPrintMargin:false,
                    fontSize:"13.5px", fontFamily:"'Fira Code',monospace",
                    wrap:true, showInvisibles:false, highlightActiveLine:true, tabSize:4
                });
                editor.setValue('# پاسخ خود را بنویسید...', -1);
                editor.session.getUndoManager().reset();
                editors[id] = editor;
                editor.on('change', () => {
                    const dot = el.parentElement.querySelector('.dot-mod');
                    if (dot && !editor.session.getUndoManager().isClean()) dot.classList.add('show');
                });
            });
        }

        // ===== راهنما با نکته‌های مخصوص هر سوال =====
        function showHelpModal(id) {
            const ch = CHALLENGES.find(c => c.id === id);
            if (!ch) return;
            document.getElementById('modalTitle').textContent = `📖 راهنما: ${ch.title}`;
            document.getElementById('modalBody').innerHTML = `
                <p><span class="highlight-text">📌 سوال:</span> ${ch.desc}</p>
                <br>
                <p><span class="highlight-text">📘 اشاره:</span> ${ch.hint}</p>
                <br>
                <p><span class="highlight-text">💡 نکته:</span></p>
                <p>${ch.help}</p>
            `;
            document.getElementById('helpModal').classList.add('show');
        }

        function closeHelpModal() {
            document.getElementById('helpModal').classList.remove('show');
        }
        document.getElementById('helpModal').addEventListener('click', function(e) {
            if (e.target === this) closeHelpModal();
        });

        async function testConnection() {
            try {
                const resp = await fetch(WORKER_URL);
                if (resp.ok) showToast('✅ اتصال برقرار است!', 'success');
                else showToast(`❌ خطا: ${resp.status}`, 'error');
            } catch(e) { showToast('❌ اتصال ناموفق!', 'error'); }
        }

        async function loginStudent() {
            const name = document.getElementById('studentName').value.trim();
            const alias = document.getElementById('studentAlias').value.trim();
            if (!name || !alias) return showToast("نام و تخلص الزامی است!", "error");
            try { await fetch(`${WORKER_URL}/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,alias}) }); } catch(e) {}
            studentData = { name, alias };
            localStorage.setItem('hackerStudent', JSON.stringify(studentData));
            unlockAllChallenges();
            document.getElementById('welcomeMsg').innerText = `خوش آمدی ${alias}!`;
            showToast(`خوش آمدی ${alias}!`, "success");
            await fetchAndApplyStatus(alias);
        }

        function unlockAllChallenges() {
            document.querySelectorAll('.terminal-card.locked').forEach(c => { c.classList.remove('locked'); c.classList.add('unlocked'); });
            document.querySelectorAll('.submit-btn').forEach(b => { b.disabled = false; });
        }

        async function fetchStatus(alias) {
            try {
                const resp = await fetch(`${WORKER_URL}/status?alias=${encodeURIComponent(alias)}`);
                if (!resp.ok) throw new Error(`Status ${resp.status}`);
                return await resp.json();
            } catch(e) { return {}; }
        }

        async function fetchAndApplyStatus(alias) {
            const statusMap = await fetchStatus(alias);
            let approved = 0;
            const total = CHALLENGES.length;
            for (const [id, info] of Object.entries(statusMap)) {
                const card = document.querySelector(`[data-challenge="${id}"]`);
                if (!card) continue;
                const btn = card.querySelector('.submit-btn');
                const editor = editors[id];
                const fb = document.getElementById(`feedback-${id}`);
                card.classList.remove('completed','rejected','pending');
                btn.classList.remove('approved','rejected','pending');
                if (info.status === 'approved') {
                    card.classList.add('completed');
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> تأیید شد';
                    btn.disabled = true; btn.classList.add('approved');
                    if (editor) editor.setReadOnly(true);
                    approved++;
                    if (fb) { fb.classList.remove('show'); fb.textContent = ''; }
                } else if (info.status === 'rejected') {
                    card.classList.add('rejected');
                    btn.innerHTML = '<i class="fas fa-redo-alt"></i> ارسال مجدد';
                    btn.disabled = false; btn.classList.add('rejected');
                    if (editor) editor.setReadOnly(false);
                    if (fb) { fb.textContent = info.feedback || 'بدون توضیح'; fb.classList.add('show'); }
                } else if (info.status === 'pending') {
                    card.classList.add('pending');
                    btn.innerHTML = '<i class="fas fa-hourglass-half"></i> در انتظار';
                    btn.disabled = true; btn.classList.add('pending');
                    if (editor) editor.setReadOnly(true);
                    if (fb) { fb.classList.remove('show'); fb.textContent = ''; }
                } else {
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> ارسال پاسخ';
                    btn.disabled = false;
                    if (editor) editor.setReadOnly(false);
                    if (fb) { fb.classList.remove('show'); fb.textContent = ''; }
                }
            }
            document.getElementById('progressFill').style.width = (approved/total*100)+'%';
            document.getElementById('progressCount').innerText = `${approved} / ${total}`;
        }

        async function submitChallenge(button, id) {
            if (!studentData) return showToast("ابتدا وارد شوید!", "error");
            const editor = editors[id];
            const answer = editor.getValue().trim();
            if (!answer || answer.replace(/#.*/g,'').replace(/\s/g,'').length < 3) {
                return showToast("پاسخ کامل بنویسید!", "error");
            }
            const orig = button.innerHTML;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ارسال...';
            button.disabled = true;
            try {
                const resp = await fetch(`${WORKER_URL}/submit`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ name:studentData.name, alias:studentData.alias, challenge:id, code:answer })
                });
                if (!resp.ok) throw new Error(`خطا ${resp.status}`);
                showToast(`چالش ${id} ارسال شد!`, "success");
                await fetchAndApplyStatus(studentData.alias);
            } catch(e) {
                button.innerHTML = orig; button.disabled = false;
                showToast(`❌ ارسال نشد: ${e.message}`, 'error');
            }
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            const icon = type==='success' ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-exclamation-triangle"></i>';
            t.innerHTML = icon + ' ' + msg;
            t.className = `toast ${type} show`;
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 4000);
        }

        window.onload = function() {
            buildCards();
            if (studentData) {
                document.getElementById('studentName').value = studentData.name;
                document.getElementById('studentAlias').value = studentData.alias;
                unlockAllChallenges();
                document.getElementById('welcomeMsg').innerText = `خوش آمدی ${studentData.alias}!`;
                fetchAndApplyStatus(studentData.alias);
            }
            setInterval(() => {
                if (studentData?.alias) fetchAndApplyStatus(studentData.alias);
            }, 15000);
        };
    </script>
</body>
